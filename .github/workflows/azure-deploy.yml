name: Deploy ConnectHub to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [
          { name: 'auth-service', path: './services/ConnectHub.Authentication' },
          { name: 'message-service', path: './services/ConnectHub.Messaging' },
          { name: 'room-service', path: './services/ConnectHub.ChatRoom-Servic' },
          { name: 'presence-service', path: './services/ConnectHub.Presence-Service' },
          { name: 'notification-service', path: './services/ConnectHub.Notification-Service' },
          { name: 'media-service', path: './services/ConnectHub.Media.API' },
          { name: 'apigateway', path: './ApiGateway' }
        ]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}/${{ matrix.service.name }}:${{ github.sha }} -t ${{ secrets.ACR_NAME }}/${{ matrix.service.name }}:latest ${{ matrix.service.path }}
          docker push ${{ secrets.ACR_NAME }}/${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}/${{ matrix.service.name }}:latest

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ matrix.service.name }} \
              --resource-group ConnectHub_RG \
              --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.service.name }}:${{ github.sha }} \
              --set-env-vars \
                GOOGLE_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
                GOOGLE_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
                ConnectionStrings__AzureBlobStorage="${{ secrets.AZURE_STORAGE_CONNECTION }}" \
                FrontendUrl="https://connecthubfrontend.z23.web.core.windows.net" \
                AllowedOrigins="https://connecthubfrontend.z23.web.core.windows.net,http://localhost:4200"
